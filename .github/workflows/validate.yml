name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate skill structure and metadata
        run: python3 scripts/validate_skills.py

      - name: Check generated indexes
        run: python3 scripts/generate_skill_index.py --check

      - name: Check evaluation contracts
        run: python3 scripts/run_evaluations.py --format json

      - name: Run evaluation harness regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run pytest repository suite
        run: pytest -q

      - name: Check local Markdown links
        run: python3 scripts/check_markdown_links.py

      - name: Check whitespace
        run: git diff --check
